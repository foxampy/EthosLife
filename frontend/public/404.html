<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | EthosLife</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #e4dfd5 0%, #dcd3c6 50%, #c8c2b6 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2d2418;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 600px;
      }
      .logo {
        font-size: 5rem;
        margin-bottom: 1rem;
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      h1 {
        font-size: 6rem;
        font-weight: 700;
        background: linear-gradient(135deg, #5c5243, #8c7a6b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1rem;
      }
      h2 {
        font-size: 2rem;
        margin-bottom: 1rem;
        color: #5c5243;
      }
      p {
        font-size: 1.2rem;
        color: #5c5243;
        margin-bottom: 2rem;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        padding: 1rem 2rem;
        background: linear-gradient(135deg, #5c5243, #8c7a6b);
        color: #e4dfd5;
        text-decoration: none;
        border-radius: 2rem;
        font-weight: 600;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(92, 82, 67, 0.3);
      }
      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(92, 82, 67, 0.4);
      }
      .features {
        margin-top: 3rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1.5rem;
      }
      .feature {
        background: rgba(255, 255, 255, 0.5);
        padding: 1.5rem;
        border-radius: 1rem;
        backdrop-filter: blur(10px);
      }
      .feature-icon {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
      }
      .feature-text {
        font-size: 0.9rem;
        color: #5c5243;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">🌱</div>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>
        Oops! The page you're looking for doesn't exist or has been moved.
        Let's get you back on track to better health.
      </p>
      <a href="/" class="btn">← Back to Home</a>
      
      <div class="features">
        <div class="feature">
          <div class="feature-icon">🥗</div>
          <div class="feature-text">Nutrition</div>
        </div>
        <div class="feature">
          <div class="feature-icon">💪</div>
          <div class="feature-text">Fitness</div>
        </div>
        <div class="feature">
          <div class="feature-icon">😴</div>
          <div class="feature-text">Sleep</div>
        </div>
        <div class="feature">
          <div class="feature-icon">🧠</div>
          <div class="feature-text">Mental Health</div>
        </div>
      </div>
    </div>
  </body>
</html>
